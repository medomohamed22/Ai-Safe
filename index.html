<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Sketch-to-UI Engine | محرك تحويل الرسومات إلى واجهات تفاعلية</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"><\/script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"><\/script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  <\/script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Cairo', 'Inter', sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    .canvas-grid {
      background-color: #ffffff;
      background-image: 
        radial-gradient(#cbd5e1 1.25px, transparent 1.25px),
        radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.7);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(99, 102, 241, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }
    .pulse-live {
      animation: pulse-ring 2s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#090d16] text-slate-100 select-none">

  <!-- Top Navigation & Hackathon Header -->
  <header class="border-b border-slate-800/80 bg-[#0d1322]/95 backdrop-blur-md sticky top-0 z-30 px-3 sm:px-5 py-2.5">
    <div class="flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand Identity -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg tracking-tight bg-gradient-to-r from-white via-indigo-200 to-purple-300 bg-clip-text text-transparent">
              Live Sketch-to-UI Engine
            </h1>
            <span class="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
              MVP v1.0
            </span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block">
            حول رسوماتك اليدوية والملاحظات إلى واجهات React + Tailwind تفاعلية فوراً
          </p>
        </div>
      </div>

      <!-- 1-Click Demo Presets (قوالب جاهزة للتحكيم) -->
      <div class="flex items-center gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-slate-800">
        <span class="text-[11px] text-slate-400 px-2 hidden xl:inline-flex items-center gap-1">
          <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400"></i>
          قوالب العرض السريع:
        </span>
        <button id="presetDashboardBtn" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 bg-indigo-600/20 text-indigo-300 border border-indigo-500/40 hover:bg-indigo-600/30">
          <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
          <span>لوحة تحكم</span>
        </button>
        <button id="presetLandingBtn" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 text-slate-300 hover:bg-slate-800 border border-transparent">
          <i data-lucide="rocket" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span>صفحة هبوط</span>
        </button>
        <button id="presetMobileBtn" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 text-slate-300 hover:bg-slate-800 border border-transparent">
          <i data-lucide="smartphone" class="w-3.5 h-3.5 text-pink-400"></i>
          <span>تطبيق موبايل</span>
        </button>
      </div>

      <!-- Right Controls: Active Provider/Model Pill, Live Sync & Settings -->
      <div class="flex items-center gap-2">
        <!-- Quick Provider & Model Status Button -->
        <button id="openSettingsQuickBtn" type="button" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-xs transition-all" title="تغيير المزود أو النموذج">
          <span id="providerStatusDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span id="activeProviderBadge" class="font-semibold text-indigo-300">Meta API</span>
          <span class="text-slate-600">|</span>
          <span id="activeModelBadge" class="font-mono text-[11px] text-slate-300 max-w-[130px] sm:max-w-[170px] truncate" dir="ltr">Llama-3.2-90B-Vision</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
        </button>

        <!-- Auto-Sync Debounce (2s) Toggle -->
        <button id="autoSyncToggleBtn" type="button" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border text-xs font-medium transition-all bg-slate-900 border-slate-700/80 text-slate-300 hover:bg-slate-800" title="توليد تلقائي بعد التوقف عن الرسم بـ 2 ثانية (Debounce)">
          <span id="autoSyncDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
          <span class="hidden md:inline">مزامنة تلقائية (2ث)</span>
          <span id="debounceTimerBadge" class="hidden font-mono text-[10px] px-1.5 py-0.2 bg-indigo-500/30 text-indigo-200 rounded">2.0s</span>
        </button>

        <!-- Primary Generate / Sync Button -->
        <button id="generateUiBtn" type="button" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white shadow-lg shadow-indigo-600/30 flex items-center gap-1.5 transition-all active:scale-95">
          <i data-lucide="wand-2" class="w-4 h-4"></i>
          <span>تحويل الرسمة لواجهة</span>
        </button>

        <!-- Settings Modal Trigger -->
        <button id="openSettingsBtn" type="button" class="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700/80 transition-all relative" title="إعدادات المزودين والنماذج (OpenRouter / Meta / Gemini)">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>

        <!-- Vercel Deploy Guide & Export Trigger -->
        <button id="openVercelModalBtn" type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-400/30 text-xs font-bold shadow-lg shadow-emerald-600/20 transition-all" title="نسخ أو تحميل كود المشروع للكمبيوتر و Vercel">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span>نسخ / حفظ المشروع للكمبيوتر</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Split-Screen Workspace -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-3 p-3 min-h-[calc(100vh-132px)]">
    
    <!-- RIGHT/LEFT PANEL 1: The Drawing Canvas (5 cols on lg) -->
    <section class="lg:col-span-5 flex flex-col bg-[#0f1626] border border-slate-800/90 rounded-2xl overflow-hidden shadow-xl">
      
      <!-- Canvas Toolbar -->
      <div class="p-2.5 border-b border-slate-800 bg-slate-900/70 flex flex-wrap items-center justify-between gap-2">
        <!-- Drawing Tools -->
        <div class="flex items-center gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
          <button type="button" data-tool="pen" class="canvas-tool-btn p-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-all" title="قلم حر (Pen)">
            <i data-lucide="pen-tool" class="w-4 h-4"></i>
          </button>
          <button type="button" data-tool="rect" class="canvas-tool-btn p-1.5 rounded-lg bg-indigo-600 text-white shadow transition-all" title="مربع / حاوية (Rectangle)">
            <i data-lucide="square" class="w-4 h-4"></i>
          </button>
          <button type="button" data-tool="circle" class="canvas-tool-btn p-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-all" title="دائرة / صورة شخصية (Circle)">
            <i data-lucide="circle" class="w-4 h-4"></i>
          </button>
          <button type="button" data-tool="arrow" class="canvas-tool-btn p-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-all" title="سهم إشارة للملاحظات (Arrow)">
            <i data-lucide="move-up-right" class="w-4 h-4"></i>
          </button>
          <button type="button" data-tool="text" class="canvas-tool-btn p-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-all" title="إضافة نص أو ملاحظة ذكية (Text / Annotation)">
            <i data-lucide="type" class="w-4 h-4"></i>
          </button>
          <button type="button" data-tool="eraser" class="canvas-tool-btn p-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-all" title="ممحاة (Eraser)">
            <i data-lucide="eraser" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Stroke Color Picker -->
        <div class="flex items-center gap-1.5 px-2 py-1 rounded-xl bg-slate-950/60 border border-slate-800/80">
          <button type="button" data-color="#1e293b" class="color-swatch w-5 h-5 rounded-full bg-slate-800 ring-2 ring-offset-2 ring-offset-slate-900 ring-indigo-400" title="أسود داكن (عناصر أساسية)"></button>
          <button type="button" data-color="#4f46e5" class="color-swatch w-5 h-5 rounded-full bg-indigo-600 opacity-75 hover:opacity-100" title="أزرق نيلي (أزرار وتفاعل)"></button>
          <button type="button" data-color="#e11d48" class="color-swatch w-5 h-5 rounded-full bg-rose-600 opacity-75 hover:opacity-100" title="أحمر (ملاحظات Annotations للذكاء الاصطناعي)"></button>
          <button type="button" data-color="#059669" class="color-swatch w-5 h-5 rounded-full bg-emerald-600 opacity-75 hover:opacity-100" title="أخضر (بيانات وجداول)"></button>
        </div>

        <!-- Actions: Undo, Redo, Upload Image, Clear -->
        <div class="flex items-center gap-1">
          <button id="undoCanvasBtn" type="button" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-all" title="تراجع (Undo)">
            <i data-lucide="undo-2" class="w-4 h-4"></i>
          </button>
          <button id="redoCanvasBtn" type="button" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-all" title="إعادة (Redo)">
            <i data-lucide="redo-2" class="w-4 h-4"></i>
          </button>
          <label for="uploadSketchInput" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-all cursor-pointer" title="رفع صورة رسمة من جهازك">
            <i data-lucide="image-plus" class="w-4 h-4"></i>
            <input id="uploadSketchInput" type="file" accept="image/*" class="hidden" />
          </label>
          <button id="downloadSketchBtn" type="button" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-all" title="تحميل الرسمة كصورة PNG">
            <i data-lucide="download" class="w-4 h-4"></i>
          </button>
          <button id="clearCanvasBtn" type="button" class="p-1.5 rounded-lg bg-rose-950/70 hover:bg-rose-900/80 text-rose-300 border border-rose-800/50 transition-all" title="مسح السبورة بالكامل">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Quick Stamp / Annotation Helpers -->
      <div class="px-3 py-1.5 bg-slate-900/40 border-b border-slate-800/70 flex items-center gap-1.5 overflow-x-auto custom-scrollbar text-[11px]">
        <span class="text-slate-400 shrink-0 font-medium">إضافة عنصر سريع:</span>
        <button type="button" data-stamp="navbar" class="stamp-btn shrink-0 px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">+ شريط علوي Navbar</button>
        <button type="button" data-stamp="card" class="stamp-btn shrink-0 px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">+ بطاقة إحصائيات KPI</button>
        <button type="button" data-stamp="table" class="stamp-btn shrink-0 px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">+ جدول مبيعات بفلتر</button>
        <button type="button" data-stamp="login" class="stamp-btn shrink-0 px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">+ نموذج دخول Login</button>
        <button type="button" data-stamp="annotation" class="stamp-btn shrink-0 px-2 py-0.5 rounded bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30">+ ملاحظة سهمية ذكية</button>
      </div>

      <!-- Interactive Canvas Area -->
      <div id="canvasContainer" class="relative flex-1 min-h-[360px] canvas-grid overflow-hidden cursor-crosshair">
        <canvas id="sketchCanvas" class="w-full h-full block touch-none"></canvas>

        <!-- Floating Inline Text Input for Text / Annotation Tool -->
        <div id="floatingTextInputWrap" class="hidden absolute z-20 bg-slate-900/95 border-2 border-indigo-500 rounded-xl p-2 shadow-2xl min-w-[230px]">
          <div class="text-[11px] text-indigo-300 font-semibold mb-1 flex items-center justify-between">
            <span>أدخل نص العنصر أو ملاحظة الـ AI:</span>
            <button id="cancelFloatingTextBtn" type="button" class="text-slate-400 hover:text-white">✕</button>
          </div>
          <div class="flex gap-1.5">
            <input id="floatingTextInput" type="text" placeholder="مثال: جدول مبيعات مع فلتر بحث..." class="flex-1 bg-slate-950 text-white text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-400" />
            <button id="confirmFloatingTextBtn" type="button" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">إضافة</button>
          </div>
        </div>

        <!-- Bottom Canvas Status Overlay -->
        <div class="absolute bottom-2.5 left-3 right-3 flex items-center justify-between pointer-events-none">
          <div class="px-2.5 py-1 rounded-lg bg-slate-900/85 backdrop-blur text-[11px] text-slate-300 border border-slate-700/70 flex items-center gap-2">
            <span id="currentToolLabel" class="font-semibold text-indigo-300">الأداة: مربع (Rectangle)</span>
            <span class="text-slate-600">•</span>
            <span id="canvasShapesCount">12 عنصر مرسوم</span>
          </div>
          <div class="px-2.5 py-1 rounded-lg bg-slate-900/85 backdrop-blur text-[11px] text-emerald-300 border border-slate-700/70 font-mono" dir="ltr">
            Base64 Ready ✓
          </div>
        </div>
      </div>
    </section>

    <!-- LEFT/RIGHT PANEL 2: Live Sandbox Renderer & Code Inspector (7 cols on lg) -->
    <section class="lg:col-span-7 flex flex-col bg-[#0f1626] border border-slate-800/90 rounded-2xl overflow-hidden shadow-xl">
      
      <!-- Preview Header & Tabs -->
      <div class="p-2.5 border-b border-slate-800 bg-slate-900/70 flex flex-wrap items-center justify-between gap-2">
        <!-- Main View Tabs -->
        <div class="flex items-center gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
          <button type="button" data-tab="preview" class="view-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow flex items-center gap-1.5 transition-all">
            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
            <span>المعاينة الحية (Live UI)</span>
          </button>
          <button type="button" data-tab="code" class="view-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 flex items-center gap-1.5 transition-all">
            <i data-lucide="code-2" class="w-3.5 h-3.5"></i>
            <span>كود React + Tailwind</span>
          </button>
          <button type="button" data-tab="payload" class="view-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 flex items-center gap-1.5 transition-all">
            <i data-lucide="scan-eye" class="w-3.5 h-3.5"></i>
            <span>فاحص الرؤية (Vision Input)</span>
          </button>
        </div>

        <!-- Viewport Switcher & Code Actions -->
        <div class="flex items-center gap-2">
          <div id="viewportControls" class="flex items-center gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
            <button type="button" data-viewport="100%" class="viewport-btn p-1.5 rounded-lg bg-slate-800 text-indigo-300" title="شاشة مكتب (Desktop)">
              <i data-lucide="monitor" class="w-3.5 h-3.5"></i>
            </button>
            <button type="button" data-viewport="768px" class="viewport-btn p-1.5 rounded-lg text-slate-400 hover:text-white" title="جهاز لوحي (Tablet)">
              <i data-lucide="tablet" class="w-3.5 h-3.5"></i>
            </button>
            <button type="button" data-viewport="390px" class="viewport-btn p-1.5 rounded-lg text-slate-400 hover:text-white" title="شاشة جوال (Mobile)">
              <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <button id="copyCodeBtn" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition-all">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span>نسخ الكود</span>
          </button>

          <button id="downloadUiHtmlBtn" type="button" class="px-2.5 py-1.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-xs font-medium flex items-center gap-1.5 transition-all" title="تحميل الواجهة المولدة كملف مستقل">
            <i data-lucide="file-down" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">تصدير الواجهة</span>
          </button>
        </div>
      </div>

      <!-- Status Bar inside Preview -->
      <div class="px-3 py-1.5 bg-slate-950/60 border-b border-slate-800/70 flex flex-wrap items-center justify-between gap-2 text-[11px]">
        <div class="flex items-center gap-2">
          <span id="generationModeBadge" class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-medium">
            جاهز للتفاعل الفوري
          </span>
          <span id="lastGeneratedInfo" class="text-slate-400">
            تم التعرف على: 4 بطاقات إحصائية + جدول مبيعات تفاعلي بفلتر بحث + رسم بياني
          </span>
        </div>
        <div class="flex items-center gap-2 font-mono text-slate-400" dir="ltr">
          <span id="latencyBadge">⚡ 0.8s</span>
        </div>
      </div>

      <!-- Tab 1: Live Interactive Sandbox Iframe -->
      <div id="tabPreviewContent" class="flex-1 bg-slate-950/90 flex items-center justify-center p-2 sm:p-3 overflow-auto relative min-h-[380px]">
        <!-- AI Loading Overlay -->
        <div id="aiGeneratingOverlay" class="hidden absolute inset-0 z-20 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3 p-6 text-center">
          <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center pulse-live">
            <i data-lucide="sparkles" class="w-7 h-7 text-indigo-400 animate-spin"></i>
          </div>
          <h3 id="aiLoadingTitle" class="text-base font-bold text-white">جاري تحليل الرسمة والملاحظات عبر نموذج الرؤية...</h3>
          <p id="aiLoadingSubtitle" class="text-xs text-slate-300 max-w-md">
            يتم الآن قراءة الأشكال الهندسية والأسهم وتحويلها إلى مكونات React + Tailwind CSS تفاعلية
          </p>
        </div>

        <div id="iframeViewportWrapper" class="w-full h-full transition-all duration-300 rounded-xl overflow-hidden border border-slate-800 shadow-2xl bg-white">
          <iframe id="livePreviewIframe" title="Live UI Sandbox Renderer" class="w-full h-full min-h-[380px] border-0" sandbox="allow-scripts allow-modals"></iframe>
        </div>
      </div>

      <!-- Tab 2: Source Code Viewer (React + Tailwind) -->
      <div id="tabCodeContent" class="hidden flex-1 flex flex-col bg-[#0b101d] overflow-hidden min-h-[380px]">

    function loadStateFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.providers) {
            appState.activeProviderId = parsed.activeProviderId || 'meta';
            appState.providers = { ...DEFAULT_PROVIDERS, ...parsed.providers };
            appState.systemPrompt = parsed.systemPrompt || DEFAULT_SYSTEM_PROMPT;
            appState.autoSync = Boolean(parsed.autoSync);
          }
        }
      } catch (err) {
        console.warn('LocalStorage load fallback:', err);
      }
    }

    function saveStateToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          activeProviderId: appState.activeProviderId,
          providers: appState.providers,
          systemPrompt: appState.systemPrompt,
          autoSync: appState.autoSync

      } catch (err) {

      }

      setTimeout(() => {

    /***************************************************************************
     * 2. INTERACTIVE DRAWING CANVAS ENGINE (Shapes, Arrows, Annotations, Base64)
     ***************************************************************************/
    const canvas = document.getElementById('sketchCanvas');
    const ctx = canvas.getContext('2d');
    let currentTool = 'rect';
    let currentColor = '#1e293b';
    let shapes = [];
    let redoStack = [];
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let currentFreehandPoints = [];
    let pendingTextCoords = { x: 120, y: 120 };
    let debounceTimer = null;
    let debounceCountdownInterval = null;

    function resizeCanvas() {
      const container = document.getElementById('canvasContainer');
      if (!container) return;
      const rect = container.getBoundingClientRect();
      canvas.width = Math.max(480, Math.floor(rect.width));
      canvas.height = Math.max(380, Math.floor(rect.height));
      renderCanvasShapes();
    }

    function drawRoughRect(context, x, y, w, h, color, label, bgFill) {
      context.save();
      if (bgFill) {
        context.fillStyle = bgFill;
        context.fillRect(x, y, w, h);
      }
      context.strokeStyle = color;
      context.lineWidth = 2.2;
      context.beginPath();
      context.roundRect ? context.roundRect(x, y, w, h, 6) : context.rect(x, y, w, h);
      context.stroke();
      if (label) {
        context.fillStyle = color;
        context.font = '600 13px Cairo, Inter, sans-serif';
        context.fillText(label, x + 10, y + 22);
      }
      context.restore();
    }

    function drawArrow(context, x1, y1, x2, y2, color) {
      context.save();
      context.strokeStyle = color;
      context.fillStyle = color;
      context.lineWidth = 2.5;
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      context.stroke();

      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headLen = 11;
      context.beginPath();
      context.moveTo(x2, y2);
      context.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
      context.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
      context.closePath();
      context.fill();
      context.restore();
    }

    function renderCanvasShapes() {
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle dot grid inside canvas so exported Base64 image looks like a clean whiteboard
      ctx.fillStyle = '#e2e8f0';
      for (let gx = 20; gx < canvas.width; gx += 24) {
        for (let gy = 20; gy < canvas.height; gy += 24) {
          ctx.fillRect(gx, gy, 1.5, 1.5);
        }
      }

      shapes.forEach(item => {
        if (item.type === 'rect') {
          drawRoughRect(ctx, item.x, item.y, item.w, item.h, item.color, item.label, item.bg);
        } else if (item.type === 'circle') {
          ctx.save();
          ctx.strokeStyle = item.color;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.arc(item.x, item.y, Math.max(5, item.r), 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        } else if (item.type === 'arrow') {
          drawArrow(ctx, item.x1, item.y1, item.x2, item.y2, item.color);
        } else if (item.type === 'text') {
          ctx.save();
          if (item.badgeBg) {
            ctx.font = '700 12px Cairo, Inter, sans-serif';
            const metrics = ctx.measureText(item.text);
            const pad = 8;
            ctx.fillStyle = item.badgeBg;
            ctx.fillRect(item.x - pad, item.y - 15, metrics.width + pad * 2, 22);
          }
          ctx.fillStyle = item.color || '#1e293b';
          ctx.font = item.font || '700 13px Cairo, Inter, sans-serif';
          ctx.fillText(item.text, item.x, item.y);
          ctx.restore();
        } else if (item.type === 'pen' && item.points && item.points.length > 1) {
          ctx.save();
          ctx.strokeStyle = item.color;
          ctx.lineWidth = item.width || 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(item.points[0].x, item.points[0].y);
          for (let i = 1; i < item.points.length; i++) {
            ctx.lineTo(item.points[i].x, item.points[i].y);
          }
          ctx.stroke();
          ctx.restore();
        } else if (item.type === 'image' && item.imgElement) {
          ctx.drawImage(item.imgElement, 10, 10, canvas.width - 20, canvas.height - 20);
        }
      });

      ctx.restore();
      const countEl = document.getElementById('canvasShapesCount');
      if (countEl) countEl.textContent = `${shapes.length} عنصر مرسوم`;
      updateVisionPayloadInspector();
    }

    function triggerAutoSyncDebounce() {
      if (!appState.autoSync) return;
      clearTimeout(debounceTimer);
      clearInterval(debounceCountdownInterval);

      const badge = document.getElementById('debounceTimerBadge');
      let remaining = 2.0;
      if (badge) {
        badge.classList.remove('hidden');
        badge.textContent = `${remaining.toFixed(1)}s`;
      }

      debounceCountdownInterval = setInterval(() => {
        remaining = Math.max(0, remaining - 0.2);
        if (badge) badge.textContent = `${remaining.toFixed(1)}s`;
      }, 200);

      debounceTimer = setTimeout(() => {
        clearInterval(debounceCountdownInterval);
        if (badge) badge.classList.add('hidden');
        handleGenerateUIFromSketch('مزامنة تلقائية بعد التوقف عن الرسم (Auto-Debounce)');
      }, 2000);
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      const pos = getCanvasCoordinates(e);
      if (currentTool === 'text') {
        pendingTextCoords = pos;
        const wrap = document.getElementById('floatingTextInputWrap');
        const input = document.getElementById('floatingTextInput');
        wrap.style.left = `${Math.min(canvas.width - 240, Math.max(12, pos.x))}px`;
        wrap.style.top = `${Math.min(canvas.height - 90, Math.max(12, pos.y))}px`;
        wrap.classList.remove('hidden');
        input.value = '';
        setTimeout(() => input.focus(), 20);
        return;
      }

      isDrawing = true;
      startX = pos.x;
      startY = pos.y;
      if (currentTool === 'pen' || currentTool === 'eraser') {
        currentFreehandPoints = [{ x: pos.x, y: pos.y }];
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const pos = getCanvasCoordinates(e);
      renderCanvasShapes();

      if (currentTool === 'pen' || currentTool === 'eraser') {
        currentFreehandPoints.push({ x: pos.x, y: pos.y });
        ctx.save();
        ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
        ctx.lineWidth = currentTool === 'eraser' ? 16 : 2.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(currentFreehandPoints[0].x, currentFreehandPoints[0].y);
        for (let i = 1; i < currentFreehandPoints.length; i++) {
          ctx.lineTo(currentFreehandPoints[i].x, currentFreehandPoints[i].y);
        }
        ctx.stroke();
        ctx.restore();
      } else if (currentTool === 'rect') {
        drawRoughRect(ctx, Math.min(startX, pos.x), Math.min(startY, pos.y), Math.abs(pos.x - startX), Math.abs(pos.y - startY), currentColor);
      } else if (currentTool === 'circle') {
        const r = Math.hypot(pos.x - startX, pos.y - startY);
        ctx.save();
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(startX, startY, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      } else if (currentTool === 'arrow') {
        drawArrow(ctx, startX, startY, pos.x, pos.y, currentColor);
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const pos = getCanvasCoordinates(e);

      if (currentTool === 'pen' || currentTool === 'eraser') {
        if (currentFreehandPoints.length > 1) {
          shapes.push({
            type: 'pen',
            points: currentFreehandPoints,
            color: currentTool === 'eraser' ? '#ffffff' : currentColor,
            width: currentTool === 'eraser' ? 16 : 2.5
          });
          redoStack = [];
        }
      } else if (currentTool === 'rect') {
        const w = Math.abs(pos.x - startX);
        const h = Math.abs(pos.y - startY);
        if (w > 8 && h > 8) {
          shapes.push({
            type: 'rect',
            x: Math.min(startX, pos.x),
            y: Math.min(startY, pos.y),
            w,
            h,
            color: currentColor
          });
          redoStack = [];
        }
      } else if (currentTool === 'circle') {
        const r = Math.hypot(pos.x - startX, pos.y - startY);
        if (r > 6) {
          shapes.push({ type: 'circle', x: startX, y: startY, r, color: currentColor });
          redoStack = [];
        }
      } else if (currentTool === 'arrow') {
        if (Math.hypot(pos.x - startX, pos.y - startY) > 10) {
          shapes.push({ type: 'arrow', x1: startX, y1: startY, x2: pos.x, y2: pos.y, color: currentColor });
          redoStack = [];
        }
      }

      renderCanvasShapes();
      triggerAutoSyncDebounce();
    });

          return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><script src="https://cdn.tailwindcss.com"><\/script></head><body class="p-4">${candidate}</body></html>`;
        }
        return candidate;
      }
      return '';
    }

    async function handleGenerateUIFromSketch(iterationPrompt = '') {
      const overlay = document.getElementById('aiGeneratingOverlay');
      const activeProv = appState.providers[appState.activeProviderId];
      const startTime = performance.now();

      if (overlay) overlay.classList.remove('hidden');

      const base64DataUrl = canvas.toDataURL('image/png');
      const base64Raw = base64DataUrl.split(',')[1];

      // Check if user configured a real API key for the active provider
      if (activeProv && activeProv.apiKey && activeProv.apiKey.trim().length > 5) {
        try {
          let generatedText = '';
          const userInstruction = iterationPrompt
            ? `قم بتحديث الواجهة الحالية بناءً على الرسمة وهذا التعديل المطلوب: "${iterationPrompt}". أعد كود HTML كامل واحد يحتوي على Tailwind CSS و JavaScript تفاعلي.`
            : `حول هذه الرسمة اليدوية والملاحظات المكتوبة عليها إلى صفحة ويب تفاعلية كاملة باستخدام Tailwind CSS و JavaScript شغال.`;

          if (activeProv.format === 'gemini') {
            const cleanBase = activeProv.baseUrl.replace(/\/+$/, '');
            const modelName = activeProv.selectedModel.replace(/^models\//, '');
            const url = `${cleanBase}/models/${modelName}:generateContent?key=${encodeURIComponent(activeProv.apiKey.trim())}`;
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: appState.systemPrompt }] },
                contents: [{
                  parts: [
                    { text: userInstruction },
                    { inlineData: { mimeType: 'image/png', data: base64Raw } }
                  ]
                }]
              })
            });
            if (!res.ok) throw new Error(`Gemini API Error (${res.status})`);
            const data = await res.json();
            generatedText = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('\n') || '';
          } else {
            // OpenAI-Compatible Multimodal format (OpenRouter, Meta Llama API, Groq, Together)
            const cleanBase = activeProv.baseUrl.replace(/\/+$/, '');
            const url = `${cleanBase}/chat/completions`;
            const headers = {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${activeProv.apiKey.trim()}`
            };
            if (cleanBase.includes('openrouter.ai')) {
              headers['HTTP-Referer'] = window.location.href;
              headers['X-Title'] = 'Live Sketch-to-UI Engine';
            }
            const res = await fetch(url, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                model: activeProv.selectedModel,
                messages: [
                  { role: 'system', content: appState.systemPrompt },
                  {
                    role: 'user',
                    content: [
                      { type: 'text', text: userInstruction },
                      { type: 'image_url', image_url: { url: base64DataUrl } }
                    ]
                  }
                ],
                temperature: 0.2
              })
            });
            if (!res.ok) throw new Error(`${activeProv.name} Error (${res.status})`);
            const data = await res.json();
            generatedText = data?.choices?.[0]?.message?.content || '';
          }

          const cleanHtml = extractCleanHtmlFromResponse(generatedText);
          if (cleanHtml) {
            currentGeneratedBundle.html = cleanHtml;
            currentGeneratedBundle.react = convertHtmlToReactComponent(cleanHtml, 'AIGeneratedSketchUI');
            document.getElementById('livePreviewIframe').srcdoc = cleanHtml;
            document.getElementById('codeEditorTextarea').value =
              currentGeneratedBundle.activeCodeView === 'react' ? currentGeneratedBundle.react : cleanHtml;

            const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
            document.getElementById('latencyBadge').textContent = `⚡ ${elapsed}s (${activeProv.selectedModel})`;
            document.getElementById('generationModeBadge').textContent = `تم التوليد عبر ${activeProv.name}`;
            if (overlay) overlay.classList.add('hidden');
            showToast(`تم توليد الواجهة بنجاح عبر ${activeProv.selectedModel}!`, 'success');
            return;
          }
        } catch (err) {
          console.warn('Live API call fell back to local engine:', err);
          showToast(`تعذر الاتصال بـ ${activeProv.name} (${err.message}) — تم التوليد عبر المحرك المحلي الفوري`, 'info');
        }
      }

      // Instant Smart Local Engine (works offline / without API key & interprets prompt keywords!)
      setTimeout(() => {
        if (iterationPrompt) {
          const p = iterationPrompt.toLowerCase();
          if (p.includes('ليلي') || p.includes('dark') || p.includes('داكن')) {
            appState.uiThemeMode = 'dark';
          } else if (p.includes('نهاري') || p.includes('فاتح') || p.includes('light')) {
            appState.uiThemeMode = 'light';
          }
          if (p.includes('دائري') || p.includes('rounded') || p.includes('حواف')) {
            appState.uiRoundedMode = true;
          }
        }

        renderPresetOutputUI(appState.activePreset, {
          dark: appState.uiThemeMode === 'dark',
          rounded: appState.uiRoundedMode,
          promptNote: iterationPrompt
        });

        const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
        document.getElementById('latencyBadge').textContent = `⚡ ${elapsed}s`;
        document.getElementById('generationModeBadge').textContent = activeProv?.apiKey
          ? `نشط: ${activeProv.name}`
          : 'وضع المحاكاة الفوري (أضف API Key من الإعدادات للاتصال الحي)';
        if (overlay) overlay.classList.add('hidden');
        showToast(iterationPrompt ? `تم تحديث الواجهة: "${iterationPrompt}"` : 'تم تحويل الرسمة إلى واجهة تفاعلية بنجاح!', 'success');
      }, 420);
    }

    async function fetchModelsFromProviderApi() {
      const prov = appState.providers[appState.activeProviderId];
      if (!prov) return;

      // Sync current inputs before fetching
      prov.apiKey = document.getElementById('apiKeyInput').value.trim();
      prov.baseUrl = document.getElementById('baseUrlInput').value.trim();
      saveStateToStorage();

      const btn = document.getElementById('fetchModelsBtn');
      const icon = document.getElementById('fetchModelsIcon');
      if (icon) icon.classList.add('animate-spin');
      if (btn) btn.disabled = true;

      try {
        const cleanBase = prov.baseUrl.replace(/\/+$/, '');
        let fetchedModels = [];

        if (prov.format === 'gemini') {
          if (!prov.apiKey) {
            throw new Error('يرجى إدخال مفتاح Gemini API أولاً لجلب قائمة النماذج الحية من Google');
          }
          const res = await fetch(`${cleanBase}/models?key=${encodeURIComponent(prov.apiKey)}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (Array.isArray(data.models)) {
            fetchedModels = data.models.map(m => {
              const shortId = (m.name || '').replace(/^models\//, '');
              const isVis = shortId.includes('gemini-1.5') || shortId.includes('gemini-2') || shortId.includes('vision') || shortId.includes('flash') || shortId.includes('pro');
              return {
                id: shortId,
                name: m.displayName || shortId,
                vision: isVis
              };
            });
          }
        } else {
          // OpenRouter / Meta API / OpenAI-compatible /models endpoint
          const headers = { 'Accept': 'application/json' };
          if (prov.apiKey) {
            headers['Authorization'] = `Bearer ${prov.apiKey}`;
          }
          const res = await fetch(`${cleanBase}/models`, { headers });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const rawList = Array.isArray(data.data) ? data.data : (Array.isArray(data.models) ? data.models : []);
          fetchedModels = rawList.map(m => {
            const id = m.id || m.name || '';
            const arch = JSON.stringify(m.architecture || m.input_modalities || '').toLowerCase();
            const isVis =
              arch.includes('image') ||
              id.toLowerCase().includes('vision') ||
              id.toLowerCase().includes('vl') ||
              id.toLowerCase().includes('gpt-4o') ||
              id.toLowerCase().includes('gemini') ||
              id.toLowerCase().includes('claude-3') ||
              id.toLowerCase().includes('maverick') ||
              id.toLowerCase().includes('scout') ||
              id.toLowerCase().includes('pixtral');
            return {
              id,
              name: m.name || id,
              vision: isVis
            };
          }).filter(m => m.id);
        }

        if (fetchedModels.length > 0) {
          prov.models = fetchedModels;
          saveStateToStorage();
          renderModelsListInModal();
          showToast(`تم جلب ${fetchedModels.length} نموذج من ${prov.name} وحفظها محلياً!`, 'success');
        } else {
          showToast('لم يتم العثور على نماذج إضافية، تم الإبقاء على القائمة الافتراضية.', 'info');
        }
      } catch (err) {
        showToast(`تنبيه جلب النماذج: ${err.message}. يمكنك استخدام النماذج الجاهزة أو البحث فيها مباشرة!`, 'error');
      } finally {
        if (icon) icon.classList.remove('animate-spin');
        if (btn) btn.disabled = false;
      }
    }

          document.getElementById('tabPreviewContent').classList.toggle('hidden', tab !== 'preview');
          document.getElementById('tabCodeContent').classList.toggle('hidden', tab !== 'code');
          document.getElementById('tabPayloadContent').classList.toggle('hidden', tab !== 'payload');
          if (tab === 'payload') updateVisionPayloadInspector();
        });
      });

      // Code View Switcher (React JSX vs Standalone HTML)
      document.getElementById('showReactCodeBtn').addEventListener('click', () => {
        currentGeneratedBundle.activeCodeView = 'react';
        document.getElementById('showReactCodeBtn').className = 'px-2.5 py-1 rounded bg-indigo-600 text-white font-mono text-[11px]';
        document.getElementById('showHtmlCodeBtn').className = 'px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:text-white font-mono text-[11px]';
        document.getElementById('codeEditorTextarea').value = currentGeneratedBundle.react;
      });

      document.getElementById('showHtmlCodeBtn').addEventListener('click', () => {
        currentGeneratedBundle.activeCodeView = 'html';
        document.getElementById('showHtmlCodeBtn').className = 'px-2.5 py-1 rounded bg-indigo-600 text-white font-mono text-[11px]';
        document.getElementById('showReactCodeBtn').className = 'px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:text-white font-mono text-[11px]';
        document.getElementById('codeEditorTextarea').value = currentGeneratedBundle.html;
      });

      document.getElementById('applyManualCodeBtn').addEventListener('click', () => {
        const val = document.getElementById('codeEditorTextarea').value;
        if (currentGeneratedBundle.activeCodeView === 'html') {
          currentGeneratedBundle.html = val;
          document.getElementById('livePreviewIframe').srcdoc = val;
          showToast('تم تحديث المعاينة الحية من الكود المعدل!', 'success');
        } else {
          showToast('انتقل إلى تبويب Standalone.html لتعديل كود المعاينة المباشر', 'info');
        }
      });

      // Viewport Responsive Switcher
      document.querySelectorAll('.viewport-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const width = btn.getAttribute('data-viewport');
          const wrapper = document.getElementById('iframeViewportWrapper');
          wrapper.style.maxWidth = width;
          document.querySelectorAll('.viewport-btn').forEach(b => {
            b.className = 'viewport-btn p-1.5 rounded-lg text-slate-400 hover:text-white';
          });
          btn.className = 'viewport-btn p-1.5 rounded-lg bg-slate-800 text-indigo-300';
        });
      });

      // Copy Code & Download Generated UI
      document.getElementById('copyCodeBtn').addEventListener('click', () => {
        const textToCopy = document.getElementById('codeEditorTextarea').value || currentGeneratedBundle.react;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(textToCopy).then(() => {
            showToast('تم نسخ الكود المصدري إلى الحافظة!', 'success');
          }).catch(() => fallbackCopy(textToCopy));
        } else {
          fallbackCopy(textToCopy);
        }
      });

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('تم نسخ الكود المصدري إلى الحافظة!', 'success');
      }

      document.getElementById('downloadUiHtmlBtn').addEventListener('click', () => {
        const blob = new Blob([currentGeneratedBundle.html], { type: 'text/html;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `generated-ui-${appState.activePreset}.html`;
        link.click();
        showToast('تم تحميل ملف الواجهة المولدة بنجاح!', 'success');
      });

      // Hybrid Iteration Bar (Form + Quick Chips)
      document.getElementById('hybridPromptForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('iterationPromptInput');
        const promptText = input.value.trim();
        if (!promptText) return;
        handleGenerateUIFromSketch(promptText);
        input.value = '';
      });

      document.querySelectorAll('.quick-iterate-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const promptText = chip.getAttribute('data-prompt');
          document.getElementById('iterationPromptInput').value = promptText;
          handleGenerateUIFromSketch(promptText);
        });
      });

      // Settings Modal Open / Close / Save
      const openSettings = () => {
        renderProvidersGridInModal();
        populateProviderFieldsInModal();
        renderModelsListInModal();
        document.getElementById('settingsModal').classList.remove('hidden');
      };

      document.getElementById('openSettingsBtn').addEventListener('click', openSettings);
      document.getElementById('openSettingsQuickBtn').addEventListener('click', openSettings);
      document.getElementById('closeSettingsModalBtn').addEventListener('click', () => {
        document.getElementById('settingsModal').classList.add('hidden');
      });

      document.getElementById('toggleApiKeyVisibilityBtn').addEventListener('click', () => {
        const inp = document.getElementById('apiKeyInput');
        inp.type = inp.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('apiKeyInput').addEventListener('input', (e) => {
        const prov = appState.providers[appState.activeProviderId];
        if (prov) {
          prov.apiKey = e.target.value.trim();
          saveStateToStorage();
          updateHeaderProviderBadge();
        }
      });

      document.getElementById('baseUrlInput').addEventListener('input', (e) => {
        const prov = appState.providers[appState.activeProviderId];
        if (prov) {
          prov.baseUrl = e.target.value.trim();
          saveStateToStorage();
        }
      });

      document.getElementById('selectedModelIdInput').addEventListener('input', (e) => {
        const prov = appState.providers[appState.activeProviderId];
        if (prov) {
          prov.selectedModel = e.target.value.trim();
          updateHeaderProviderBadge();
          saveStateToStorage();
        }
      });

      // Model Search Filter & Vision Checkbox
      document.getElementById('modelSearchFilterInput').addEventListener('input', renderModelsListInModal);
      document.getElementById('visionOnlyFilterCheckbox').addEventListener('change', renderModelsListInModal);

      // Fetch Models Button
      document.getElementById('fetchModelsBtn').addEventListener('click', fetchModelsFromProviderApi);

      // Add Custom Provider Form
      document.getElementById('toggleAddProviderFormBtn').addEventListener('click', () => {
        document.getElementById('addCustomProviderBox').classList.toggle('hidden');
      });
      document.getElementById('cancelCustomProviderBtn').addEventListener('click', () => {
        document.getElementById('addCustomProviderBox').classList.add('hidden');
      });
      document.getElementById('saveCustomProviderBtn').addEventListener('click', () => {
        const name = document.getElementById('customProviderNameInput').value.trim();
        const format = document.getElementById('customProviderFormatSelect').value;
        const url = document.getElementById('customProviderUrlInput').value.trim();
        if (!name || !url) {
          showToast('يرجى إدخال اسم المزود ورابط الـ Base URL', 'error');
          return;
        }
        const id = 'custom_' + Date.now();
        appState.providers[id] = {
          id,
          name,
          badge: 'Custom',
          format,
          baseUrl: url,
          apiKey: '',
          selectedModel: format === 'gemini' ? 'gemini-2.5-flash' : 'meta-llama/llama-3.2-90b-vision-instruct',
          hint: 'مزود مخصص تم حفظه محلياً في المتصفح.',
          models: [
            { id: 'meta-llama/llama-3.2-90b-vision-instruct', name: 'Llama 3.2 90B Vision', vision: true },
            { id: 'gpt-4o', name: 'GPT-4o Vision', vision: true }
          ]
        };
        appState.activeProviderId = id;
        saveStateToStorage();
        document.getElementById('addCustomProviderBox').classList.add('hidden');
        document.getElementById('customProviderNameInput').value = '';
        document.getElementById('customProviderUrlInput').value = '';
        renderProvidersGridInModal();
        populateProviderFieldsInModal();
        renderModelsListInModal();
        updateHeaderProviderBadge();
        showToast(`تمت إضافة المزود "${name}" بنجاح!`, 'success');
      });

      // Save & Reset Settings
      document.getElementById('saveSettingsBtn').addEventListener('click', () => {
        const prov = appState.providers[appState.activeProviderId];
        if (prov) {
          prov.apiKey = document.getElementById('apiKeyInput').value.trim();
          prov.baseUrl = document.getElementById('baseUrlInput').value.trim();
          prov.selectedModel = document.getElementById('selectedModelIdInput').value.trim() || prov.selectedModel;
        }
        appState.systemPrompt = document.getElementById('systemPromptTextarea').value.trim() || DEFAULT_SYSTEM_PROMPT;
        saveStateToStorage();
        updateHeaderProviderBadge();
        updateVisionPayloadInspector();
        document.getElementById('settingsModal').classList.add('hidden');
        showToast('تم حفظ الإعدادات وتفعيل النموذج في المتصفح بنجاح!', 'success');
      });

      document.getElementById('resetSettingsBtn').addEventListener('click', () => {
        appState.providers = JSON.parse(JSON.stringify(DEFAULT_PROVIDERS));
        appState.activeProviderId = 'meta';
        appState.systemPrompt = DEFAULT_SYSTEM_PROMPT;
        saveStateToStorage();
        renderProvidersGridInModal();
        populateProviderFieldsInModal();
        renderModelsListInModal();
        updateHeaderProviderBadge();
        showToast('تمت استعادة الإعدادات الافتراضية', 'info');
      });

      // Vercel Export Modal
      function getCleanProjectSourceHtml() {
        return '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      }
      document.getElementById('openVercelModalBtn').addEventListener('click', () => {
        document.getElementById('vercelModal').classList.remove('hidden');
        const ta = document.getElementById('fullProjectSourceTextarea');
        if (ta) {
          ta.value = getCleanProjectSourceHtml();
        }
      });
      document.getElementById('copyFullProjectHtmlBtn').addEventListener('click', () => {
        const fullHtml = getCleanProjectSourceHtml();
        const ta = document.getElementById('fullProjectSourceTextarea');
        if (ta) {
          ta.value = fullHtml;
          ta.focus();
          ta.select();
        }
        try {
          document.execCommand('copy');
          showToast('تم نسخ كود المشروع (index.html) بالكامل إلى الحافظة! الصقه في ملف على جهازك (Ctrl+V)', 'success');
        } catch (e) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fullHtml);
          }
          showToast('تم تحديد الكود بالكامل — اضغط Ctrl+C لنسخه!', 'info');
        }
      });
      document.getElementById('closeVercelModalBtn').addEventListener('click', () => {
        document.getElementById('vercelModal').classList.add('hidden');
      });
      document.getElementById('downloadVercelIndexBtn').addEventListener('click', () => {
        const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        a.click();
        showToast('تم تحميل index.html الجاهز للرفع على Vercel!', 'success');
      });
      document.getElementById('downloadVercelConfigBtn').addEventListener('click', () => {
        const vercelJson = JSON.stringify({
          version: 2,
          cleanUrls: true,
          rewrites: [{ source: '/(.*)', destination: '/index.html' }]
        }, null, 2);
        const blob = new Blob([vercelJson], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'vercel.json';
        a.click();
        showToast('تم تحميل ملف vercel.json!', 'success');
      });
    }

    // Initialize Application on Load
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();
      loadStateFromStorage();
      updateHeaderProviderBadge();
      initEventListeners();
      resizeCanvas();
      loadPresetWireframe('dashboard');
      window.addEventListener('resize', resizeCanvas);
    });
  </script>
</body>
</html>
